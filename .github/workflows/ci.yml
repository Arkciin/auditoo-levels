name: CI

on:
  push:
  pull_request:

# A newer commit on the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, tests, build, end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and formatting
        run: pnpm biome ci .

      # src/routeTree.gen.ts is committed, so the web app typechecks before any build.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      # The web app and the server, which the end-to-end tests run against.
      - name: Build
        run: pnpm build

      # Compressed sizes of the built app; fails when what a phone downloads before the first
      # screen outgrows its budget (scripts/bundle-size.mjs).
      - name: Bundle size budget
        run: pnpm size

      # The Chromium build matching the installed @playwright/test, with its system libraries.
      - name: Install Playwright's Chromium
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        id: e2e
        run: pnpm e2e

      # Screenshots of the failures, and traces of the retries, in an HTML report.
      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  e2e-postgres:
    # The same end-to-end suite against PostgreSQL itself, the major version Render runs, rather
    # than PGlite: the SQL, the drivers and the isolation levels as in production.
    name: End-to-end tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: releve
          POSTGRES_PASSWORD: releve
          POSTGRES_DB: releve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U releve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Install Playwright's Chromium
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        id: e2e
        run: pnpm e2e
        env:
          E2E_DATABASE_URL: postgres://releve:releve@localhost:5432/releve

      - name: Upload the Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-postgres
          path: apps/web/playwright-report/
          retention-days: 14
